name: Release

# Releases are paused until the first version is ready. To turn them on, add an
# NPM_TOKEN repository secret and replace workflow_dispatch with:
#
#   push:
#     branches:
#       - main
on:
  workflow_dispatch:

permissions: {}

# Never run two releases at once, and never cancel one partway through.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Push version commits and tags, and create GitHub releases.
      contents: write
      # Open and update the Version Packages pull request.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-node-pnpm
        with:
          # A cache written by another workflow could change what is published.
          cache: "false"
      - run: pnpm typecheck
      - run: pnpm test:run
      - run: pnpm build
      - run: pnpm check:package

      # With changesets on main, opens or updates the Version Packages pull
      # request. When that pull request is merged, publishes the new version
      # to npm, tags it and creates a GitHub release.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm changeset publish
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
