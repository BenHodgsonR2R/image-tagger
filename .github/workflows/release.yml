name: Release

# Publishes to npm with trusted publishing: npm trusts this workflow, so no
# token is stored. See docs/releasing.md.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

# Never run two releases at once, and never cancel one partway through.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Push version commits and tags, and create GitHub releases.
      contents: write
      # Open and update the Version Packages pull request.
      pull-requests: write
      # Proves this workflow's identity to npm for trusted publishing.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-node-pnpm
        with:
          # A cache written by another workflow could change what is published.
          cache: "false"
      - run: pnpm typecheck
      - run: pnpm test:run
      - run: pnpm build
      - run: pnpm check:package

      # With changesets on main, opens or updates the Version Packages pull
      # request. When that pull request is merged, publishes the new version
      # to npm, tags it and creates a GitHub release.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm changeset publish
          pr-title: "chore(release): version packages"
          commit-message: "chore(release): version packages"
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
