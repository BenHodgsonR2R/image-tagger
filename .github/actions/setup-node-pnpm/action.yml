name: Setup Node and pnpm
description: Installs pnpm and Node, then installs dependencies.

inputs:
  node-version:
    description: Node version. Defaults to the version in .nvmrc.
    required: false
  cache:
    description: Whether to cache the pnpm store. Turn off for release jobs.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # Version comes from packageManager in package.json.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        run_install: false

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        # node-version, when given, takes precedence over the file.
        node-version: ${{ inputs.node-version }}
        node-version-file: .nvmrc
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}

    - run: pnpm install --frozen-lockfile
      shell: bash
