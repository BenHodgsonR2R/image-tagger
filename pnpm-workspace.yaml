packages:
  # The root is the published package. changesets only versions workspace packages.
  - "."
  - example
  - demo
  - docs

# Dependencies allowed to run install scripts.
allowBuilds:
  # Checks its platform binary is installed. Needed by tsx and vitest.
  esbuild: true

# Our own packages, which the demo uses as soon as they are released.
minimumReleaseAgeExclude:
  - "@bhodgson/*"
  - astro@7.4.1
